name: Deploy to AKS

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Wikimedia Connector
      - Build EONET Connector
      - Build SL News Connector
      - Build Flink Jobs
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Patch image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          for manifest in k8s/flink/*.yaml k8s/kafka/kafka-connect.yaml; do
            sed -i "s|\${ACR_LOGIN_SERVER}|${ACR_LOGIN_SERVER}|g" "$manifest"
            sed -i "s|:1\.0\.0|:${IMAGE_TAG}|g" "$manifest"
          done

      - name: Install Strimzi operator
        run: |
          helm repo add strimzi https://strimzi.io/charts/
          helm upgrade --install strimzi strimzi/strimzi-kafka-operator \
            -n vega --create-namespace -f helm/strimzi-values.yaml || true

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/kafka/
          kubectl apply -f k8s/flink/
          kubectl apply -f k8s/monitoring/

      - name: Verify pods
        run: kubectl get pods -n vega
