name: Compose Validate

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose*.yml'
      - '.github/workflows/compose-validate.yml'
  pull_request:
    paths:
      - 'docker-compose*.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Validate docker-compose.monitoring.yml
        run: docker compose -f docker-compose.monitoring.yml config
