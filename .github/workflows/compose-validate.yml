name: Compose Validate

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose*.yml'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/compose-validate.yml'
  pull_request:
    paths:
      - 'docker-compose*.yml'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/compose-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Validate docker-compose.monitoring.yml
        run: docker compose -f docker-compose.monitoring.yml config

  smoke-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package modules (skip tests)
        run: make build
