apiVersion: 1

groups:
  - orgId: 1
    name: vega-pipeline
    folder: Vega
    interval: 1m
    rules:
      - uid: vega_kafka_consumer_lag_high
        title: High Consumer Lag
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: kafka_consumer_group_lag
              instant: false
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 10000
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
        for: 5m
        annotations:
          summary: Kafka consumer lag exceeds 10,000
          description: Consumer group {{ $labels.consumergroup }} has lag {{ $value }}
        labels:
          severity: warning
