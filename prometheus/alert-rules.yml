groups:
  - name: vega-pipeline
    rules:
      - alert: VegaKafkaConsumerLagHigh
        expr: kafka_consumer_group_lag > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag exceeds 10,000"
          description: "Consumer group {{ $labels.consumergroup }} has lag {{ $value }}"

      - alert: VegaFlinkCheckpointFailure
        expr: increase(flink_jobmanager_job_numberOfFailedCheckpoints[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Flink checkpoint failure detected"
          description: "Job {{ $labels.job_name }} has failed checkpoints"

      - alert: VegaNoEventsReceived
        expr: rate(kafka_topic_partition_current_offset{topic=~"raw-.*"}[5m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No events received in 5 minutes"
          description: "Topic {{ $labels.topic }} has zero ingest rate"

      - alert: VegaJvmHeapHigh
        expr: jvm_memory_bytes_used{area="heap"} / jvm_memory_bytes_max{area="heap"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage above 90%"
          description: "Instance {{ $labels.instance }} heap at {{ $value | humanizePercentage }}"

      - alert: VegaSLNewsIngestStalled
        expr: rate(kafka_topic_partition_current_offset{topic="raw-sl-news"}[5m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "SL News ingest stalled"
          description: "Topic raw-sl-news has zero ingest rate for 10 minutes"

      - alert: VegaFlinkJobDown
        expr: flink_jobmanager_numRunningJobs == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "No Flink jobs running"
          description: "Flink JobManager reports zero running jobs"

      - alert: VegaSchemaRegistryDown
        expr: up{job="schema-registry"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Schema Registry is down"
          description: "Schema Registry target {{ $labels.instance }} is unreachable"

      - alert: VegaWikiIngestStalled
        expr: rate(kafka_topic_partition_current_offset{topic="raw-wiki-events"}[5m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Wikipedia ingest stalled"
          description: "Topic raw-wiki-events has zero ingest rate for 10 minutes"

      - alert: VegaEonetIngestStalled
        expr: rate(kafka_topic_partition_current_offset{topic="raw-natural-events"}[5m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "EONET ingest stalled"
          description: "Topic raw-natural-events has zero ingest rate for 10 minutes"
